name: destroy

# Manual tear-down so the stack only costs money while you are testing.
# Actions -> destroy -> Run workflow -> type DESTROY
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to delete the whole stack"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_region: ap-southeast-1
  TF_VAR_project: exam-a3
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_notify_email: ${{ vars.NOTIFY_EMAIL }}
  TF_VAR_image_tag: destroy
  TF_INPUT: "false"

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubActionsDestroy

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Terraform reads the Lambda package folder even when destroying
      - name: Build Lambda package
        working-directory: .
        run: |
          chmod +x scripts/build-lambda.sh
          ./scripts/build-lambda.sh

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=exam-a3/terraform.tfstate" \
            -backend-config="region=ap-southeast-1" \
            -backend-config="use_lockfile=true"

      - name: Terraform destroy
        run: terraform destroy -auto-approve
